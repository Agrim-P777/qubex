name: Qubex release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Expected a version tag such as v0.1.0" >&2
            exit 1
          }
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to a commit on main" >&2
            exit 1
          }
      - name: Test
        run: make test
      - name: Package binaries and Homebrew formula
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          make release VERSION="$version"
          python3 scripts/generate_homebrew_formula.py "$version"
          cd dist
          sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/qbx-*-* dist/qbx_*.tar.gz dist/SHA256SUMS \
            dist/THIRD_PARTY_NOTICES.txt dist/Formula/qbx.rb \
            "${args[@]}"
